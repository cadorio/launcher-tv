name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # O runner do GitHub já vem com o Android SDK (ANDROID_HOME).
      - run: ./gradlew --no-daemon assembleRelease
      - run: bash -n tools/tv.sh && bash -n tizen/build.sh
      # Versão Tizen: o JS precisa ser ES5 (TVs Samsung antigas usam Chromium 47).
      - run: npx --yes acorn@8.14.0 --ecma5 --silent tizen/js/main.js
      - run: python3 -c "import xml.dom.minidom as m; m.parse('tizen/config.xml')"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-tv-apk
          path: app/build/outputs/apk/release/app-release.apk
