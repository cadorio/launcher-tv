plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cadorio.launchertv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cadorio.launchertv'
        // 21 = Android 5.0: cobre todas as TVs Android, inclusive as Sony Bravia de 2015.
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Instalado por ADB, nunca publicado em loja: assina com a chave de debug.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
