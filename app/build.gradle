plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cadorio.launchertv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cadorio.launchertv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Instalado por ADB, nunca publicado em loja: assina com a chave de debug.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
